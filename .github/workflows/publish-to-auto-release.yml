name: "publish"

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

# This is the example from the readme.
# On each push to the `release` branch it will create or update a GitHub release, build your app, and upload the artifacts to the release.

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04" # for Tauri v1 you could replace this with ubuntu-20.04.
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        # webkitgtk 4.0 is for Tauri v1 - webkitgtk 4.1 is for Tauri v2.
        # You can remove the one that doesn't apply to your app to speed up the workflow a bit.

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install frontend dependencies
        run: bun install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: "v__VERSION__"
          releaseBody: |
            ## 📥 Download Instructions

            Choose the appropriate file for your operating system:

            ### Windows
            - **`.exe`** - Windows installer (recommended for most users)
            - **`.msi`** - Windows MSI package (for enterprise deployment)

            ### macOS
            - **`_aarch64.dmg`** - For Apple Silicon Macs (M1/M2/M3/M4)
            - **`_x64.dmg`** - For Intel-based Macs
            - **`.app.tar.gz`** - Portable app bundle (extract and run)

            ### Linux
            - **`.AppImage`** - Universal Linux binary (make executable and run)
            - **`.deb`** - For Debian/Ubuntu systems (`sudo dpkg -i filename.deb`)
            - **`.rpm`** - For Red Hat/Fedora/SUSE systems (`sudo rpm -i filename.rpm`)

            ---

            💡 **Not sure which version to choose?**
            - **Windows**: Download the `.exe` file
            - **macOS**: Download `_aarch64.dmg` for newer Macs or `_x64.dmg` for older Intel Macs
            - **Linux**: Try the `.AppImage` for maximum compatibility
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
