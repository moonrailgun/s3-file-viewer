<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S3 File Viewer - Login & Connection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #495057;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6c757d;
            margin-bottom: 40px;
            font-size: 16px;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .status-connected {
            background: #28a745;
        }

        .status-disconnected {
            background: #dc3545;
        }

        .connection-form {
            text-align: left;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #495057;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            background: #f8f9fa;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .connect-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .connect-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .connect-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border: 1px solid #c3e6cb;
            display: none;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border: 1px solid #f5c6cb;
            display: none;
        }

        .continue-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
            display: none;
        }

        .continue-btn:hover {
            background: #218838;
            transform: translateY(-1px);
        }

        .preset-buttons {
            margin-top: 30px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .preset-btn {
            padding: 8px 16px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .preset-btn:hover {
            background: #e9ecef;
            border-color: #adb5bd;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <span class="status-indicator status-disconnected"></span>
            S3 File Viewer
        </div>
        <div class="subtitle">Connect to Your S3 Storage Service</div>

        <form class="connection-form" onsubmit="return false;">
            <div class="input-group">
                <label>Endpoint</label>
                <input type="text" id="endpoint" placeholder="https://s3.amazonaws.com" value="https://s3.amazonaws.com">
            </div>

            <div class="input-group">
                <label>Access Key</label>
                <input type="text" id="accessKey" placeholder="Enter Access Key">
            </div>

            <div class="input-group">
                <label>Secret Key</label>
                <input type="password" id="secretKey" placeholder="Enter Secret Key">
            </div>

            <div class="input-group">
                <label>Region</label>
                <input type="text" id="region" placeholder="us-east-1" value="us-east-1">
            </div>

            <button class="connect-btn" onclick="connectToS3()">
                <span id="btn-text">Connect</span>
            </button>
        </form>

        <div class="preset-buttons">
            <button class="preset-btn" onclick="loadPreset('aws')">AWS S3</button>
            <button class="preset-btn" onclick="loadPreset('minio')">MinIO</button>
            <button class="preset-btn" onclick="loadPreset('aliyun')">Alibaba Cloud OSS</button>
            <button class="preset-btn" onclick="loadPreset('tencent')">Tencent Cloud COS</button>
        </div>

        <div class="success-message" id="success-message">
            ✅ Connection successful! Redirecting to file browser...
        </div>

        <div class="error-message" id="error-message">
            ❌ Connection failed, please check configuration
        </div>

        <button class="continue-btn" id="continue-btn" onclick="goToFileBrowser()">
            Enter File Browser
        </button>
    </div>

    <script>
        function loadPreset(type) {
            const presets = {
                'aws': {
                    endpoint: 'https://s3.amazonaws.com',
                    region: 'us-east-1'
                },
                'minio': {
                    endpoint: 'http://localhost:9000',
                    region: 'us-east-1'
                },
                'aliyun': {
                    endpoint: 'https://oss-cn-hangzhou.aliyuncs.com',
                    region: 'cn-hangzhou'
                },
                'tencent': {
                    endpoint: 'https://cos.ap-beijing.myqcloud.com',
                    region: 'ap-beijing'
                }
            };

            const preset = presets[type];
            if (preset) {
                document.getElementById('endpoint').value = preset.endpoint;
                document.getElementById('region').value = preset.region;
            }
        }

        function connectToS3() {
            const endpoint = document.getElementById('endpoint').value;
            const accessKey = document.getElementById('accessKey').value;
            const secretKey = document.getElementById('secretKey').value;
            const region = document.getElementById('region').value;

            if (!endpoint || !accessKey || !secretKey || !region) {
                showError('Please fill in complete connection information');
                return;
            }

            // Simulate connection process
            const connectBtn = document.querySelector('.connect-btn');
            const btnText = document.getElementById('btn-text');
            const statusIndicator = document.querySelector('.status-indicator');

            btnText.innerHTML = '<span class="loading"></span>Connecting...';
            connectBtn.disabled = true;

            // Hide previous messages
            hideMessages();

            setTimeout(() => {
                // Simulate successful connection
                statusIndicator.className = 'status-indicator status-connected';
                btnText.textContent = 'Connected';
                connectBtn.style.background = '#28a745';

                showSuccess();
                document.getElementById('continue-btn').style.display = 'inline-block';

                // Save connection info to localStorage
                localStorage.setItem('s3-connection', JSON.stringify({
                    endpoint,
                    accessKey,
                    secretKey,
                    region,
                    connected: true
                }));

            }, 2000);
        }

        function showSuccess() {
            document.getElementById('success-message').style.display = 'block';
        }

        function showError(message) {
            const errorEl = document.getElementById('error-message');
            errorEl.textContent = `❌ ${message}`;
            errorEl.style.display = 'block';
        }

        function hideMessages() {
            document.getElementById('success-message').style.display = 'none';
            document.getElementById('error-message').style.display = 'none';
        }

        function goToFileBrowser() {
            window.location.href = 'browser.html';
        }

        // Check connection status when page loads
        document.addEventListener('DOMContentLoaded', function() {
            const savedConnection = localStorage.getItem('s3-connection');
            if (savedConnection) {
                const connection = JSON.parse(savedConnection);
                if (connection.connected) {
                    // If already connected, redirect directly
                    setTimeout(() => {
                        goToFileBrowser();
                    }, 1000);
                }
            }
        });
    </script>
</body>
</html>
